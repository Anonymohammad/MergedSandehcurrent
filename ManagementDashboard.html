                                <tr>
                                    <td colSpan="3" className="text-center text-sm text-gray-500 px-3 py-4">No aggregators defined yet.</td>
                                </tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* System Settings Panel */}
            <div className="bg-white rounded-lg shadow">
                <button onClick={() => setShowSettings(!showSettings)} className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <h3 className="text-lg font-semibold text-gray-800">⚙️ System Settings</h3>
                        <p className="text-sm text-gray-600">Configure costs, targets, and operational thresholds</p>
                    </div>
                    <div className={`transform transition-transform ${showSettings ? 'rotate-180' : ''}`}>
                        <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                    </div>
                </button>
                {showSettings && (
                    <div className="px-6 pb-6 border-t">
                        {systemSettings.length === 0 ? (
                            <p className="text-gray-500 mt-4 text-sm">Loading settings...</p>
                        ) : (
                            <div className="mt-4 space-y-3">
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {systemSettings.filter(s => s.setting_name !== 'management_pin').map(s => (
                                        <div key={s.setting_name} className="flex flex-col gap-1">
                                            <label className="text-xs font-medium text-gray-600 uppercase tracking-wide">{s.setting_name.replace(/_/g, ' ')}</label>
                                            <input
                                                type="text"
                                                value={s.setting_value}
                                                onChange={e => updateSetting(s.setting_name, e.target.value)}
                                                className="border rounded px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500"
                                            />
                                            {s.description && <p className="text-xs text-gray-400">{s.description}</p>}
                                        </div>
                                    ))}
                                </div>
                                <div className="pt-3 border-t flex justify-end">
                                    <button onClick={saveSettings} disabled={settingsSaving} className="px-6 py-2 bg-olive-600 text-white rounded hover:bg-olive-700 disabled:opacity-50 text-sm">
                                        {settingsSaving ? 'Saving...' : 'Save Settings'}
                                    </button>
                                </div>
                            </div>
                        )}
                    </div>
                )}
            </div>

            {/* Petty Cash History */}
            <div className="bg-white rounded-lg shadow">
                <button onClick={() => { setShowPettyCash(!showPettyCash); if (!showPettyCash && !pettyCashHistory) loadPettyCashHistory(); }} className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <h3 className="text-lg font-semibold text-gray-800">🧾 Petty Cash History</h3>
                        <p className="text-sm text-gray-600">View cash expense records by date</p>
                    </div>
                    <div className={`transform transition-transform ${showPettyCash ? 'rotate-180' : ''}`}>
                        <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                    </div>
                </button>
                {showPettyCash && (
                    <div className="px-6 pb-6 border-t">
                        <div className="flex flex-wrap gap-3 mt-4 mb-4 items-end">
                            <div>
                                <label className="text-xs text-gray-600 block mb-1">From</label>
                                <input type="date" value={pettyCashRange.start} onChange={e => setPettyCashRange(p => ({...p, start: e.target.value}))} className="border rounded px-3 py-2 text-sm" />
                            </div>
                            <div>
                                <label className="text-xs text-gray-600 block mb-1">To</label>
                                <input type="date" value={pettyCashRange.end} onChange={e => setPettyCashRange(p => ({...p, end: e.target.value}))} className="border rounded px-3 py-2 text-sm" />
                            </div>
                            <button onClick={loadPettyCashHistory} disabled={pettyCashLoading} className="px-4 py-2 bg-olive-600 text-white rounded hover:bg-olive-700 text-sm disabled:opacity-50">
                                {pettyCashLoading ? 'Loading...' : 'Filter'}
                            </button>
                        </div>
                        {pettyCashHistory && pettyCashHistory.success && (
                            pettyCashHistory.groups.length === 0 ? (
                                <p className="text-gray-500 text-sm">No petty cash records found.</p>
                            ) : (
                                <div className="space-y-4">
                                    {pettyCashHistory.groups.map((group, gi) => (
                                        <div key={gi} className="border rounded-lg overflow-hidden">
                                            <div className="bg-gray-50 px-4 py-2 flex justify-between items-center">
                                                <span className="font-medium text-gray-800">{group.date}</span>
                                                <span className="text-sm font-semibold text-red-600">Total: {group.total.toFixed(2)} QAR</span>
                                            </div>
                                            <table className="min-w-full text-sm">
                                                <thead><tr className="border-b bg-gray-50">
                                                    <th className="text-left px-4 py-2 text-xs text-gray-500">Category</th>
                                                    <th className="text-left px-4 py-2 text-xs text-gray-500">Description</th>
                                                    <th className="text-left px-4 py-2 text-xs text-gray-500">Paid By</th>
                                                    <th className="text-right px-4 py-2 text-xs text-gray-500">Amount</th>
                                                </tr></thead>
                                                <tbody>{group.entries.map((e, ei) => (
                                                    <tr key={ei} className="border-b last:border-0">
                                                        <td className="px-4 py-2 text-gray-700">{e.category || '—'}</td>
                                                        <td className="px-4 py-2 text-gray-600">{e.description || '—'}</td>
                                                        <td className="px-4 py-2 text-gray-500">{e.paid_by || 'Cash'}</td>
                                                        <td className="px-4 py-2 text-right font-medium">{parseFloat(e.amount).toFixed(2)} QAR</td>
                                                    </tr>
                                                ))}</tbody>
                                            </table>
                                        </div>
                                    ))}
                                    <div className="text-right font-semibold text-gray-800 pt-2">
                                        Grand Total: {pettyCashHistory.groups.reduce((s, g) => s + g.total, 0).toFixed(2)} QAR
                                    </div>
                                </div>
                            )
                        )}
                    </div>
                )}
            </div>

            {/* Weekly Inventory History */}
            <div className="bg-white rounded-lg shadow">
                <button onClick={() => { setShowWeeklyHistory(!showWeeklyHistory); if (!showWeeklyHistory && !weeklyHistory) loadWeeklyHistory(); }} className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50">
                    <div>
                        <h3 className="text-lg font-semibold text-gray-800">📋 Weekly Inventory History</h3>
                        <p className="text-sm text-gray-600">View last 12 weeks of inventory counts</p>
                    </div>
                    <div className={`transform transition-transform ${showWeeklyHistory ? 'rotate-180' : ''}`}>
                        <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" /></svg>
                    </div>
                </button>
                {showWeeklyHistory && (
                    <div className="px-6 pb-6 border-t">
                        <div className="flex justify-end mt-4 mb-3">
                            <button onClick={loadWeeklyHistory} disabled={weeklyLoading} className="px-4 py-2 bg-gray-100 rounded hover:bg-gray-200 text-sm">
                                {weeklyLoading ? 'Loading...' : 'Refresh'}
                            </button>
                        </div>
                        {weeklyHistory && weeklyHistory.success && (
                            weeklyHistory.weeks.length === 0 ? (
                                <p className="text-gray-500 text-sm">No weekly inventory records found.</p>
                            ) : (
                                <div className="space-y-3">
                                    {weeklyHistory.weeks.map((week, wi) => (
                                        <div key={wi} className="border rounded-lg overflow-hidden">
                                            <button onClick={() => setExpandedWeek(expandedWeek === wi ? null : wi)} className="w-full bg-gray-50 px-4 py-3 flex justify-between items-center hover:bg-gray-100">
                                                <div className="text-left">
                                                    <span className="font-medium text-gray-800">Week of {week.week_start}</span>
                                                    {week.week_end && <span className="text-gray-500 text-sm ml-2">→ {week.week_end}</span>}
                                                </div>
                                                <div className="flex items-center gap-3">
                                                    <span className="text-xs text-gray-500">{week.items.length} items</span>
                                                    <span className={`transform transition-transform text-gray-400 ${expandedWeek === wi ? 'rotate-180' : ''}`}>▼</span>
                                                </div>
                                            </button>
                                            {expandedWeek === wi && (
                                                <div className="overflow-x-auto">
                                                    <table className="min-w-full text-sm">
                                                        <thead><tr className="border-b bg-gray-50">
                                                            <th className="text-left px-4 py-2 text-xs text-gray-500">Category</th>
                                                            <th className="text-left px-4 py-2 text-xs text-gray-500">Item</th>
                                                            <th className="text-right px-4 py-2 text-xs text-gray-500">Opening</th>
                                                            <th className="text-right px-4 py-2 text-xs text-gray-500">Received</th>
                                                            <th className="text-right px-4 py-2 text-xs text-gray-500">Expired</th>
                                                            <th className="text-right px-4 py-2 text-xs text-gray-500">Remaining</th>
                                                            <th className="text-right px-4 py-2 text-xs text-gray-500">Used</th>
                                                            <th className="text-left px-4 py-2 text-xs text-gray-500">Unit</th>
                                                        </tr></thead>
                                                        <tbody>{week.items.map((item, ii) => {
                                                            const used = (parseFloat(item.opening_quantity)||0) + (parseFloat(item.received_quantity)||0) - (parseFloat(item.expired_quantity)||0) - (parseFloat(item.remaining_quantity)||0);
                                                            return (
                                                                <tr key={ii} className="border-b last:border-0 hover:bg-gray-50">
                                                                    <td className="px-4 py-2 text-gray-500 text-xs">{item.category}</td>
                                                                    <td className="px-4 py-2 text-gray-800 font-medium">{item.item_name}</td>
                                                                    <td className="px-4 py-2 text-right">{item.opening_quantity}</td>
                                                                    <td className="px-4 py-2 text-right text-blue-600">{item.received_quantity}</td>
                                                                    <td className="px-4 py-2 text-right text-red-500">{item.expired_quantity}</td>
                                                                    <td className="px-4 py-2 text-right">{item.remaining_quantity}</td>
                                                                    <td className="px-4 py-2 text-right font-medium text-green-700">{used.toFixed(2)}</td>
                                                                    <td className="px-4 py-2 text-gray-500 text-xs">{item.unit}</td>
                                                                </tr>
                                                            );
                                                        })}</tbody>
                                                    </table>
                                                    {week.notes && <p className="px-4 py-2 text-xs text-gray-500 border-t">Notes: {week.notes}</p>}
                                                </div>
                                            )}
                                        </div>
                                    ))}
                                </div>
                            )
                        )}
                    </div>
                )}
            </div>

            {/* Data Status Section - Collapsible */}
            <div className="bg-white rounded-lg shadow">
                <button
                    onClick={() => setShowDataStatus(!showDataStatus)}
                    className="w-full p-6 text-left flex justify-between items-center hover:bg-gray-50"
                >
                    <div>
                        <h3 className="text-lg font-semibold text-gray-800">📊 Data Status & Information</h3>
                        <p className="text-sm text-gray-600">View data availability and system information</p>
                    </div>
                    <div className={`transform transition-transform ${showDataStatus ? 'rotate-180' : ''}`}>
                        <svg className="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M19 9l-7 7-7-7" />
                        </svg>
                    </div>
                </button>
                
                {showDataStatus && (
                    <div className="px-6 pb-6 border-t">
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mt-4">
                            {/* Data Availability */}
                            <div>
                                <h4 className="font-medium text-gray-700 mb-3">Data Availability</h4>
                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Shawarma Data:</span>
                                        <span className={`font-medium ${dashboardData && dashboardData.data_found && dashboardData.data_found.shawarma ? 'text-green-600' : 'text-red-600'}`}>
                                            {dashboardData && dashboardData.data_found && dashboardData.data_found.shawarma ? 'Available' : 'Missing'}
                                        </span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Sales Data:</span>
                                        <span className={`font-medium ${dashboardData && dashboardData.data_found && dashboardData.data_found.sales ? 'text-green-600' : 'text-red-600'}`}>
                                            {dashboardData && dashboardData.data_found && dashboardData.data_found.sales ? 'Available' : 'Missing'}
                                        </span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Inventory Data:</span>
                                        <span className={`font-medium ${dashboardData && dashboardData.data_found && dashboardData.data_found.rawProteins ? 'text-green-600' : 'text-red-600'}`}>
                                            {dashboardData && dashboardData.data_found && dashboardData.data_found.rawProteins ? 'Available' : 'Missing'}
                                        </span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Bread Data:</span>
                                        <span className={`font-medium ${dashboardData && dashboardData.data_found && dashboardData.data_found.bread ? 'text-green-600' : 'text-red-600'}`}>
                                            {dashboardData && dashboardData.data_found && dashboardData.data_found.bread ? 'Available' : 'Missing'}
                                        </span>
                                    </div>
                                </div>
                            </div>

                            {/* Period Information */}
                            <div>
                                <h4 className="font-medium text-gray-700 mb-3">Period Information</h4>
                                <div className="space-y-2 text-sm">
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Selected Period:</span>
                                        <span className="font-medium">{selectedPeriod === 'custom' ? 'Custom Date' : selectedPeriod.charAt(0).toUpperCase() + selectedPeriod.slice(1)}</span>
                                    </div>
                                    {customDate && (
                                        <div className="flex justify-between">
                                            <span className="text-gray-600">Custom Date:</span>
                                            <span className="font-medium">{customDate}</span>
                                        </div>
                                    )}
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Requested Date:</span>
                                        <span className="font-medium">{dashboardData && dashboardData.requested_date ? dashboardData.requested_date : 'N/A'}</span>
                                    </div>
                                    <div className="flex justify-between">
                                        <span className="text-gray-600">Data Date:</span>
                                        <span className="font-medium">{dashboardData && dashboardData.date ? dashboardData.date : 'N/A'}</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* ── Procurement Planning ── */}
                        <div className="mt-6 border-t pt-4">
                            <button
                                onClick={() => { setShowProcurement(!showProcurement); if (!productsWithRecipes) loadProductsWithRecipes(); }}
                                className="flex items-center gap-2 text-sm font-medium text-gray-700 hover:text-gray-900 w-full"
                            >
                                <span className={`transform transition-transform ${showProcurement ? 'rotate-90' : ''}`}>▶</span>
                                📦 Procurement Planning
                            </button>

                            {showProcurement && (
                                <div className="mt-4 space-y-6">

                                    {/* Inputs */}
                                    <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 space-y-3">
                                        <h4 className="font-semibold text-blue-800 text-sm">Planning Inputs</h4>
                                        <div className="grid grid-cols-2 md:grid-cols-3 gap-3">
                                            {[
                                                { label: 'Period Start', key: 'periodStartDate', type: 'date' },
                                                { label: 'Period Days', key: 'periodDays', type: 'number' },
                                                { label: 'Est. Revenue (QAR)', key: 'estimatedRevenue', type: 'number' },
                                                { label: 'Shawarma % of Revenue', key: 'shawarmaRevenuePct', type: 'number' },
                                                { label: 'Buffer %', key: 'bufferPct', type: 'number' }
                                            ].map(({ label, key, type }) => (
                                                <div key={key}>
                                                    <label className="block text-xs font-medium text-gray-600 mb-1">{label}</label>
                                                    <input
                                                        type={type}
                                                        value={procParams[key]}
                                                        onChange={e => setProcParams(prev => ({ ...prev, [key]: e.target.value }))}
                                                        className="w-full p-2 border rounded text-sm focus:ring-2 focus:ring-blue-400"
                                                        step={type === 'number' ? 'any' : undefined}
                                                    />
                                                </div>
                                            ))}
                                        </div>
                                        <p className="text-xs text-blue-600">
                                            Shawarma revenue = {procParams.estimatedRevenue ? ((parseFloat(procParams.estimatedRevenue)||0) * (parseFloat(procParams.shawarmaRevenuePct)||0) / 100).toFixed(0) : '—'} QAR &nbsp;|&nbsp;
                                            Other = {procParams.estimatedRevenue ? ((parseFloat(procParams.estimatedRevenue)||0) * (1 - (parseFloat(procParams.shawarmaRevenuePct)||0)/100)).toFixed(0) : '—'} QAR
                                        </p>
                                    </div>

                                    {/* Product Sales Mix — other items only */}
                                    {productsWithRecipes && (
                                        <div className="space-y-3">

                                            {/* Shawarma info row — not editable here */}
                                            <div className="flex items-center gap-3 p-3 bg-orange-50 border border-orange-200 rounded-lg text-sm">
                                                <span className="text-lg">🥙</span>
                                                <div className="flex-1">
                                                    <p className="font-semibold text-orange-800">Shawarma — calculated as a single pool</p>
                                                    <p className="text-xs text-orange-600 mt-0.5">
                                                        Ingredients calculated from: shawarma revenue % × (revenue ÷ avg selling price = est. qty) × recipe per item.
                                                        Per-variant breakdown available after POS integration.
                                                    </p>
                                                </div>
                                                <div className="text-right shrink-0">
                                                    <p className="text-xs text-orange-700 font-medium">Avg price</p>
                                                    <p className="text-sm font-bold text-orange-800">{getSettingValue('avg_shawarma_selling_price', '25')} QAR</p>
                                                </div>
                                            </div>

                                            {/* Other products mix */}
                                            {(() => {
                                                const otherProducts = productMix.filter(p => !(p.category||'').toLowerCase().includes('shawarma'));
                                                if (!otherProducts.length) return null;
                                                const distributeEvenly = () => {
                                                    const share = parseFloat((100 / otherProducts.length).toFixed(1));
                                                    setProductMix(prev => prev.map(x =>
                                                        !(x.category||'').toLowerCase().includes('shawarma')
                                                            ? { ...x, sales_mix_pct: share } : x
                                                    ));
                                                };
                                                return (
                                                    <div className="border rounded-lg overflow-hidden">
                                                        <div className="px-3 py-2 bg-gray-50 flex items-center justify-between">
                                                            <div>
                                                                <span className="text-xs font-semibold text-gray-700">🍽️ Other Products — relative weight</span>
                                                                <p className="text-xs text-gray-500 mt-0.5">Enter any numbers — they are normalized automatically. Leave all at 0 for equal distribution.</p>
                                                            </div>
                                                            <div className="flex items-center gap-2 shrink-0">
                                                                <button
                                                                    onClick={distributeEvenly}
                                                                    className="text-xs px-2 py-1 bg-gray-200 text-gray-700 rounded hover:bg-gray-300"
                                                                >Equal</button>
                                                                <button
                                                                    onClick={saveProductMix}
                                                                    disabled={mixSaving}
                                                                    className="text-xs px-3 py-1 bg-gray-700 text-white rounded hover:bg-gray-800 disabled:opacity-50"
                                                                >{mixSaving ? 'Saving…' : 'Save'}</button>
                                                            </div>
                                                        </div>
                                                        <table className="w-full text-sm">
                                                            <thead className="bg-gray-50 border-b">
                                                                <tr>
                                                                    <th className="text-left px-3 py-1 text-xs font-medium text-gray-600">Product</th>
                                                                    <th className="text-left px-3 py-1 text-xs font-medium text-gray-600 hidden md:table-cell">Recipe</th>
                                                                    <th className="px-3 py-1 text-xs font-medium text-gray-600 w-24 text-right">Weight</th>
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {otherProducts.map(pm => {
                                                                    const detail = productsWithRecipes.find(p => p.id === pm.id);
                                                                    return (
                                                                        <tr key={pm.id} className="border-b last:border-0 hover:bg-gray-50">
                                                                            <td className="px-3 py-2 text-sm font-medium">{pm.name}</td>
                                                                            <td className="px-3 py-2 text-xs text-gray-500 hidden md:table-cell">
                                                                                {detail && detail.recipe.length > 0
                                                                                    ? detail.recipe.map(r => `${r.ingredient_name} (${r.quantity_needed} ${r.unit})`).join(', ')
                                                                                    : <span className="text-orange-500">⚠ No recipe</span>}
                                                                            </td>
                                                                            <td className="px-3 py-2 text-right">
                                                                                <input
                                                                                    type="number"
                                                                                    min="0" step="any"
                                                                                    value={pm.sales_mix_pct}
                                                                                    onChange={e => setProductMix(prev => prev.map(x => x.id === pm.id ? { ...x, sales_mix_pct: parseFloat(e.target.value)||0 } : x))}
                                                                                    className="w-20 p-1 border rounded text-sm text-right"
                                                                                />
                                                                            </td>
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                );
                                            })()}
                                        </div>
                                    )}

                                    {/* Generate button */}
                                    <button
                                        onClick={runProcurementPlan}
                                        disabled={procurementLoading || !procParams.estimatedRevenue}
                                        className="w-full py-2 bg-blue-600 text-white rounded-lg font-medium hover:bg-blue-700 disabled:opacity-50"
                                    >
                                        {procurementLoading ? '⏳ Calculating…' : '📊 Generate Procurement Plan'}
                                    </button>

                                    {/* Results */}
                                    {procurementResult && procurementResult.success && (
                                        <div className="space-y-4">

                                            {/* Summary bar */}
                                            <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                                {[
                                                    { label: 'Est. Revenue', value: `${(procurementResult.estimated_revenue||0).toFixed(0)} QAR` },
                                                    { label: 'Shawarma Revenue', value: `${((procurementResult.estimated_revenue||0)*(procurementResult.shawarma_rev_pct||0)/100).toFixed(0)} QAR` },
                                                    { label: 'Buffer Applied', value: `${procurementResult.buffer_pct}%` },
                                                    { label: 'Items to Restock', value: `${(procurementResult.restock_alerts||[]).length}`, highlight: (procurementResult.restock_alerts||[]).length > 0 }
                                                ].map(({ label, value, highlight }) => (
                                                    <div key={label} className={`p-3 rounded-lg border text-center ${highlight ? 'bg-red-50 border-red-300' : 'bg-gray-50 border-gray-200'}`}>
                                                        <p className="text-xs text-gray-500">{label}</p>
                                                        <p className={`font-bold text-lg ${highlight ? 'text-red-700' : 'text-gray-800'}`}>{value}</p>
                                                    </div>
                                                ))}
                                            </div>

                                            {/* No-recipe warning */}
                                            {(procurementResult.no_recipe_products||[]).length > 0 && (
                                                <div className="p-3 bg-orange-50 border border-orange-300 rounded-lg text-sm text-orange-800">
                                                    ⚠️ These products have no recipe configured — their ingredients were not included:
                                                    <strong> {procurementResult.no_recipe_products.join(', ')}</strong>
                                                </div>
                                            )}

                                            {/* Restock Alerts */}
                                            {(procurementResult.restock_alerts||[]).length > 0 && (
                                                <div>
                                                    <h4 className="font-semibold text-red-700 mb-2">🚨 Restock Required</h4>
                                                    <div className="overflow-x-auto">
                                                        <table className="w-full text-sm border-collapse">
                                                            <thead>
                                                                <tr className="bg-red-50">
                                                                    {['Ingredient','Unit','Need + Buffer','In Stock','Deficit','Order Qty'].map(h => (
                                                                        <th key={h} className="border border-red-200 px-3 py-2 text-left text-xs font-semibold text-red-800">{h}</th>
                                                                    ))}
                                                                </tr>
                                                            </thead>
                                                            <tbody>
                                                                {procurementResult.restock_alerts.map(ing => (
                                                                    <tr key={ing.ingredient_id} className="hover:bg-red-50">
                                                                        <td className="border border-gray-200 px-3 py-2 font-medium">{ing.name}</td>
                                                                        <td className="border border-gray-200 px-3 py-2 text-gray-500">{ing.unit}</td>
                                                                        <td className="border border-gray-200 px-3 py-2">{ing.needed_with_buffer}</td>
                                                                        <td className="border border-gray-200 px-3 py-2 text-green-700">{ing.current_stock}</td>
                                                                        <td className="border border-gray-200 px-3 py-2 text-red-700 font-medium">{ing.deficit}</td>
                                                                        <td className="border border-gray-200 px-3 py-2 font-semibold">
                                                                            {ing.order_units
                                                                                ? `${ing.order_units} ${ing.purchase_unit_name || 'units'} (${ing.order_qty} ${ing.unit})`
                                                                                : `${ing.order_qty} ${ing.unit}`}
                                                                        </td>
                                                                    </tr>
                                                                ))}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                </div>
                                            )}

                                            {/* Full ingredient list */}
                                            <div>
                                                <h4 className="font-semibold text-gray-700 mb-2">Full Ingredient Requirements</h4>
                                                <div className="overflow-x-auto">
                                                    <table className="w-full text-sm border-collapse">
                                                        <thead>
                                                            <tr className="bg-gray-50">
                                                                {['Ingredient','Cat.','Unit','Raw Need','+ Buffer','In Stock','Order'].map(h => (
                                                                    <th key={h} className="border border-gray-200 px-3 py-2 text-left text-xs font-medium text-gray-600">{h}</th>
                                                                ))}
                                                            </tr>
                                                        </thead>
                                                        <tbody>
                                                            {(procurementResult.ingredients||[]).map(ing => (
                                                                <tr key={ing.ingredient_id} className={`hover:bg-gray-50 ${ing.needs_restock ? 'bg-red-50' : ''}`}>
                                                                    <td className="border border-gray-200 px-3 py-2 font-medium">{ing.name}</td>
                                                                    <td className="border border-gray-200 px-3 py-2 text-xs text-gray-500">{ing.category}</td>
                                                                    <td className="border border-gray-200 px-3 py-2 text-xs text-gray-500">{ing.unit}</td>
                                                                    <td className="border border-gray-200 px-3 py-2">{ing.needed_raw}</td>
                                                                    <td className="border border-gray-200 px-3 py-2">{ing.needed_with_buffer}</td>
                                                                    <td className={`border border-gray-200 px-3 py-2 ${ing.needs_restock ? 'text-red-600 font-medium' : 'text-green-700'}`}>{ing.current_stock}</td>
                                                                    <td className="border border-gray-200 px-3 py-2 font-semibold text-blue-700">
                                                                        {ing.needs_restock
                                                                            ? (ing.order_units
                                                                                ? `${ing.order_units} ${ing.purchase_unit_name||'units'} (${ing.order_qty} ${ing.unit})`
                                                                                : `${ing.order_qty} ${ing.unit}`)
                                                                            : <span className="text-gray-400 font-normal">✓ sufficient</span>}
                                                                    </td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            </div>
                                        </div>
                                    )}

                                    {procurementResult && !procurementResult.success && (
                                        <div className="p-3 bg-red-50 border border-red-300 rounded text-sm text-red-700">
                                            Error: {procurementResult.message}
                                        </div>
                                    )}
                                </div>
                            )}
                        </div>

                        {/* Debug Data Toggle */}
                        <div className="mt-6 border-t pt-4">
                            <button
                                onClick={() => setShowDebugData(!showDebugData)}
                                className="flex items-center gap-2 text-sm text-gray-600 hover:text-gray-800"
                            >
                                <span className={`transform transition-transform ${showDebugData ? 'rotate-90' : ''}`}>
                                    ▶
                                </span>
                                View Debug Data (Raw JSON)
                            </button>
                            
                            {showDebugData && (
                                <div className="mt-3">
                                    <div className="bg-gray-100 p-4 rounded-lg overflow-auto max-h-96">
                                        <pre className="text-xs text-gray-800">
                                            {JSON.stringify(dashboardData, null, 2)}
                                        </pre>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                )}
            </div>
        </div>
    );
}

window.ManagementDashboard = ManagementDashboard;
</script>
